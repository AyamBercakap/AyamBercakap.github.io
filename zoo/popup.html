<!DOCTYPE html>
<head>
    <title>Test</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="animalModal" class="modal">
    <div class="card-wrap">
        <button class="close">close</button>
        <div class="animal-card">

            

            <div class="left-panel">

                <img id="animalImage" class="animal-image">

                <div class="info">
                    <div><strong><img src="Assets/Icons/jangka.svg"> Lifespan</strong><span id="life"></span></div>
                    <div><strong><img src="Assets/Icons/makanan.svg"> Diet</strong><span id="diet"></span></div>
                    <div><strong><img src="Assets/Icons/Asal.svg"> Origin</strong><span id="origin"></span></div>
                    <div><strong><img src="Assets/Icons/Status.svg">Conservation</strong><span id="status"></span></div>
                </div>

            </div>

            <div class="right-panel">

                <h1 id="animalName"></h1>

                <h2 id="scientificName"></h2>

                <hr>

                <p id="descriptionMY"></p>

                <p class="english" id="descriptionEN"></p>

                <div class="fact-box">
                    <h3><img src="Assets/Icons/fact.svg">Fun Fact</h3>
                    <p id="fact"></p>
                </div>

            </div>

        </div>
    </div>
</div>
</body>
</html>
